<!DOCTYPE html>
<html>
<head>
    <title>Exemplo DIV</title>
    <style>
        .caixa {
            border: 2px solid black;
            padding: 10px;
            margin: 5px;
            background-color: red;
        }
    </style>
</head>
<body>

    <div class="caixa">
        <h2>Seção 1</h2>
        <p>Esse é um conteúdo dentro de um DIV.</p>
    </div>

    <div class="caixa">
        <h2>Seção 2</h2>
        <p>Outro bloco separado por DIV.</p>
    </div>

</body>
</html>
